name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r scripts/requirements.txt
      - run: npm ci
      - run: python -m py_compile scripts/update_data.py scripts/build_holder_data.py
      - run: python scripts/build_holder_data.py
      - run: git diff --exit-code -- public/data/holder-structure.csv public/data/holder-structure.json
      - run: npm test
      - run: npm run build
