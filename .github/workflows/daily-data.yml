name: Refresh ETF data

on:
  schedule:
    - cron: "30 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-etf-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r scripts/requirements.txt
      - run: npm ci
      - run: python scripts/update_data.py
      - run: npm test
      - run: npm run build
      - name: Commit refreshed data
        run: |
          git add public/data/etf-shares.csv public/data/etf-shares.json
          if git diff --cached --quiet; then
            echo "No generated data changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: refresh ETF shares"
            git push
          fi
      # Pushes made with GITHUB_TOKEN do not trigger other workflows, so deploy here too.
      - name: Deploy refreshed static assets
        run: >-
          npx --yes wrangler@4.118.0 pages deploy dist
          --project-name csi300-etf-shares
          --branch main
          --commit-hash "$(git rev-parse HEAD)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 09ef5c28de15a8c878caaf34640d9d9a
